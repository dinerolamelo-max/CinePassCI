
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePassCI - Films en ligne</title>
  <style>
    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #e50914;
      padding: 20px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
    }
    main { padding: 20px; }
    .film {
      background: #222;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
    }
    button {
      background: #e50914;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>CinePassCI</header>
  <main>
    <h2>Bienvenue sur CinePassCI</h2>
    <p>Découvre tes films préférés en ligne.</p>

    <div class="film">
      <h3>Film 1</h3>
      <p>Accède à ce film après paiement.</p>
      <button onclick="alert('Le paiement sera bientôt disponible.')">
        Voir les offres
      </button>
    </div>

    <div class="film">
      <h3>Film 2</h3>
      <p>Découvre bientôt notre catalogue.</p>
      <button onclick="alert('Le paiement sera bientôt disponible.')">
        Voir les offres
      </button>
    </div>
  </main>
</body>
</html>
